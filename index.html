<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoRecall - Active Recall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

        // ==========================================
        const API_KEY = "AIzaSyDgP2rMi6hsKRmm8WifIfgwTCv_ewr3iBg"; 
        // ==========================================

        const App = () => {
            const [step, setStep] = useState('welcome');
            const [sourceLang, setSourceLang] = useState(() => localStorage.getItem('lingo_lang') || '');
            const [sentences, setSentences] = useState(() => JSON.parse(localStorage.getItem('lingo_sentences')) || []);
            const [inputValue, setInputValue] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);

            useEffect(() => {
                if (sourceLang) {
                    localStorage.setItem('lingo_lang', sourceLang);
                    if (step === 'welcome') setStep('input');
                }
            }, [sourceLang]);

            useEffect(() => {
                localStorage.setItem('lingo_sentences', JSON.stringify(sentences));
            }, [sentences]);

            // DENNE FUNKTION PRØVER FLERE MODELLER HVIS EN FEJLER
            const fetchTranslation = async (text, lang, key) => {
                const models = ["gemini-1.5-flash", "gemini-pro", "gemini-1.0-pro"];
                let lastError = "";

                for (let model of models) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Oversæt "${text}" fra ${lang} til dansk. Svar KUN med selve oversættelsen.` }] }]
                            })
                        });
                        
                        const res = await response.json();
                        if (res.candidates && res.candidates[0].content.parts[0].text) {
                            return res.candidates[0].content.parts[0].text.trim();
                        }
                        if (res.error) lastError = res.error.message;
                    } catch (e) {
                        lastError = e.message;
                    }
                }
                throw new Error(lastError || "Kunne ikke forbinde til Gemini");
            };

            const handleTranslate = async (e) => {
                e.preventDefault();
                const cleanKey = API_KEY.trim();
                if (!inputValue.trim() || isProcessing) return;
                if (!cleanKey) return alert("API-nøgle mangler!");

                setIsProcessing(true);
                const text = inputValue;
                setInputValue('');

                try {
                    const danish = await fetchTranslation(text, sourceLang, cleanKey);
                    setSentences(prev => [{ id: Date.now(), original: text, danish, createdAt: Date.now() }, ...prev]);
                } catch (err) { 
                    alert("API Fejl: " + err.message);
                }
                setIsProcessing(false);
            };

            const playAudio = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'da-DK';
                    window.speechSynthesis.speak(msg);
                }
            };

            // --- UI ELEMENTER ---
            const Icon = ({ name }) => {
                const icons = {
                    plus: '<path d="M5 12h14m-7-7v14"/>',
                    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5a2.5 2.5 0 0 1 2.5-2.5H20v14"/>',
                    card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
                    volume: '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>',
                    trash: '<path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
                    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'
                };
                return React.createElement('svg', {
                    width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
                    strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round",
                    dangerouslySetInnerHTML: { __html: icons[name] }
                });
            };

            return React.createElement('div', { className: 'max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl' },
                sourceLang && step !== 'welcome' && React.createElement('nav', { className: 'bg-white border-b p-4 sticky top-0 z-50 flex justify-around shadow-sm' },
                    ['input', 'review', 'flashcards'].map(s => React.createElement('button', {
                        key: s, onClick: () => setStep(s),
                        className: `flex flex-col items-center gap-1 ${step === s ? 'text-blue-600' : 'text-slate-400'}`
                    }, React.createElement(Icon, { name: s === 'input' ? 'plus' : s === 'review' ? 'book' : 'card' })))
                ),
                React.createElement('main', { className: 'p-5 flex-1' },
                    (!sourceLang || step === 'welcome') && React.createElement('div', { className: 'pt-10 space-y-6 text-center animate-fade-in' },
                        React.createElement('h1', { className: 'text-3xl font-black text-blue-600' }, 'LingoRecall'),
                        React.createElement('p', { className: 'text-slate-500' }, 'Vælg dit modersmål:'),
                        React.createElement('div', { className: 'grid gap-2 text-left h-[50vh] overflow-y-auto pr-2 bg-slate-50 p-2 rounded-xl' },
                            ["English", "Spanish", "French", "German", "Arabic", "Hindi", "Russian", "Japanese", "Turkish", "Vietnamese", "Portuguese", "Italian", "Polish", "Ukrainian", "Persian", "Urdu", "Dutch", "Greek", "Swedish", "Thai"].map(l => 
                                React.createElement('button', {
                                    key: l, onClick: () => setSourceLang(l),
                                    className: 'p-4 bg-white border border-slate-100 rounded-xl hover:border-blue-500 font-medium transition-all shadow-sm'
                                }, l)
                            )
                        )
                    ),
                    sourceLang && step === 'input' && React.createElement('div', { className: 'space-y-6 animate-fade-in' },
                        React.createElement('header', null, React.createElement('h2', { className: 'text-2xl font-bold' }, 'Tilføj sætning'), React.createElement('p', { className: 'text-slate-400' }, sourceLang + ' → Dansk')),
                        React.createElement('form', { onSubmit: handleTranslate, className: 'relative' },
                            React.createElement('input', {
                                value: inputValue, onChange: e => setInputValue(e.target.value),
                                placeholder: 'Skriv her...',
                                className: 'w-full p-5 pr-14 bg-white rounded-2xl border-2 border-slate-100 shadow-sm focus:border-blue-500 outline-none text-lg',
                                disabled: isProcessing
                            }),
                            React.createElement('button', { type: 'submit', className: 'absolute right-3 top-3 bottom-3 w-10 bg-blue-600 text-white rounded-xl flex items-center justify-center active:scale-90 transition-transform' },
                                isProcessing ? '...' : React.createElement(Icon, { name: 'send' })
                            )
                        ),
                        React.createElement('div', { className: 'space-y-3' },
                            sentences.map(s => React.createElement('div', { key: s.id, className: 'p-4 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center shadow-sm' },
                                React.createElement('div', { className: 'truncate pr-4' }, 
                                    React.createElement('p', { className: 'font-medium truncate' }, s.original),
                                    React.createElement('p', { className: 'text-blue-600 text-xs italic' }, s.danish)
                                ),
                                React.createElement('button', { onClick: () => setSentences(sentences.filter(x => x.id !== s.id)), className: 'text-slate-300 hover:text-red-500' }, React.createElement(Icon, { name: 'trash' }))
                            ))
                        )
                    ),
                    sourceLang && step === 'review' && React.createElement('div', { className: 'space-y-4 animate-fade-in' },
                        sentences.map(s => React.createElement('div', { key: s.id, className: 'bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between shadow-sm' },
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-xs text-slate-300 font-bold uppercase' }, sourceLang),
                                React.createElement('p', { className: 'mb-2' }, s.original),
                                React.createElement('p', { className: 'text-xs text-blue-500 font-bold uppercase' }, 'Dansk'),
                                React.createElement('p', { className: 'text-lg font-bold' }, s.danish)
                            ),
                            React.createElement('button', { onClick: () => playAudio(s.danish), className: 'w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 transition-all' }, React.createElement(Icon, { name: 'volume' }))
                        ))
                    ),
                    sourceLang && step === 'flashcards' && React.createElement(Flashcards, { sentences, playAudio, sourceLang })
                )
            );
        };

        const Flashcards = ({ sentences, playAudio, sourceLang }) => {
            const [stack, setStack] = useState([...sentences]);
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [done, setDone] = useState(false);

            if (sentences.length === 0) return React.createElement('div', { className: 'text-center py-20 text-slate-400' }, 'Tilføj gloser først.');
            if (done) return React.createElement('div', { className: 'text-center py-10 space-y-6 animate-fade-in' }, 
                React.createElement('h2', { className: 'text-2xl font-bold' }, 'Færdig!'),
                React.createElement('button', { onClick: () => { setStack([...sentences]); setIdx(0); setDone(false); setFlipped(false); }, className: 'p-5 bg-blue-600 text-white rounded-2xl w-full font-bold' }, 'Øv igen')
            );

            const curr = stack[idx];
            const next = (correct) => {
                if (correct) {
                    if (idx + 1 >= stack.length) setDone(true);
                    else { setIdx(idx + 1); setFlipped(false); }
                } else {
                    const s = [...stack];
                    const item = s.splice(idx, 1)[0];
                    s.push(item);
                    setStack(s);
                    setFlipped(false);
                }
            };

            return React.createElement('div', { className: 'space-y-8 animate-fade-in' },
                React.createElement('div', { 
                    className: 'relative h-80 w-full perspective-1000 cursor-pointer',
                    onClick: () => setFlipped(!flipped)
                },
                    React.createElement('div', { className: `relative w-full h-full card-transition preserve-3d ${flipped ? 'rotate-y-180' : ''}` },
                        React.createElement('div', { className: 'absolute inset-0 backface-hidden bg-white rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center border' },
                            React.createElement('p', { className: 'text-2xl font-medium' }, curr.original)
                        ),
                        React.createElement('div', { className: 'absolute inset-0 backface-hidden rotate-y-180 bg-blue-600 rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center text-white' },
                            React.createElement('p', { className: 'text-2xl font-bold mb-8' }, curr.danish),
                            React.createElement('button', { onClick: (e) => { e.stopPropagation(); playAudio(curr.danish); }, className: 'w-16 h-16 bg-white/20 rounded-full flex items-center justify-center' }, '🔊')
                        )
                    )
                ),
                React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                    React.createElement('button', { onClick: () => next(false), className: 'p-5 bg-white border-2 border-red-50 text-red-500 rounded-2xl font-bold' }, 'Svært'),
                    React.createElement('button', { onClick: () => next(true), className: 'p-5 bg-white border-2 border-green-50 text-green-600 rounded-2xl font-bold' }, 'Let')
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
