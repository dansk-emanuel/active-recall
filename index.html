<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoRecall - Sikker Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

        const App = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('openai_key') || '');
            const [step, setStep] = useState('welcome');
            const [sourceLang, setSourceLang] = useState(() => localStorage.getItem('lingo_lang') || '');
            const [sentences, setSentences] = useState(() => JSON.parse(localStorage.getItem('lingo_sentences')) || []);
            const [inputValue, setInputValue] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);

            // Gem sprog og nøgle lokalt i browseren
            useEffect(() => {
                if (apiKey) localStorage.setItem('openai_key', apiKey);
                if (sourceLang) localStorage.setItem('lingo_lang', sourceLang);
            }, [apiKey, sourceLang]);

            useEffect(() => {
                localStorage.setItem('lingo_sentences', JSON.stringify(sentences));
            }, [sentences]);

            const handleTranslate = async (e) => {
                e.preventDefault();
                if (!inputValue.trim() || isProcessing) return;
                if (!apiKey) return setStep('settings');

                setIsProcessing(true);
                const text = inputValue;
                setInputValue('');

                try {
                    const response = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: "gpt-4o-mini",
                            messages: [
                                { role: "system", content: "Oversæt kun teksten til dansk uden forklaringer." },
                                { role: "user", content: `Oversæt fra ${sourceLang} til dansk: ${text}` }
                            ]
                        })
                    });
                    
                    const res = await response.json();
                    if (res.error) throw new Error(res.error.message);

                    const danish = res.choices[0].message.content.trim();
                    setSentences(prev => [{ id: Date.now(), original: text, danish }, ...prev]);
                } catch (err) { 
                    alert("Fejl: " + err.message);
                    if (err.message.includes("API key")) setStep('settings');
                }
                setIsProcessing(false);
            };

            // Hvis der ingen API nøgle er, vis en "Login" skærm
            if (!apiKey || step === 'settings') {
                return React.createElement('div', { className: 'max-w-md mx-auto p-10 space-y-6 text-center' },
                    React.createElement('h1', { className: 'text-2xl font-bold' }, 'Indstil LingoRecall'),
                    React.createElement('p', { className: 'text-slate-500 text-sm' }, 'Indsæt din OpenAI API-nøgle for at starte. Nøglen gemmes kun i din egen browser.'),
                    React.createElement('input', {
                        type: 'password',
                        placeholder: 'sk-....',
                        className: 'w-full p-4 border rounded-xl',
                        value: apiKey,
                        onChange: (e) => setApiKey(e.target.value)
                    }),
                    React.createElement('button', { 
                        onClick: () => { if(apiKey) setStep('welcome') },
                        className: 'w-full p-4 bg-blue-600 text-white rounded-xl font-bold'
                    }, 'Gem og start')
                );
            }

            // --- RESTEN AF PROGRAMMET ER SOM FØR ---
            const playAudio = (text) => {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'da-DK';
                window.speechSynthesis.speak(msg);
            };

            const Icon = ({ name }) => {
                const icons = {
                    plus: '<path d="M5 12h14m-7-7v14"/>',
                    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5a2.5 2.5 0 0 1 2.5-2.5H20v14"/>',
                    card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>'
                };
                return React.createElement('svg', {
                    width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
                    strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round",
                    dangerouslySetInnerHTML: { __html: icons[name] }
                });
            };

            return React.createElement('div', { className: 'max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col' },
                sourceLang && React.createElement('nav', { className: 'bg-white border-b p-4 flex justify-around sticky top-0 z-10' },
                    ['input', 'review', 'flashcards'].map(s => React.createElement('button', {
                        key: s, onClick: () => setStep(s),
                        className: `p-2 ${step === s ? 'text-blue-600' : 'text-slate-400'}`
                    }, React.createElement(Icon, { name: s === 'input' ? 'plus' : s === 'review' ? 'book' : 'card' })))
                ),
                React.createElement('main', { className: 'p-5 flex-1' },
                    (!sourceLang || step === 'welcome') ? 
                    React.createElement('div', { className: 'space-y-4' },
                        React.createElement('h2', { className: 'text-xl font-bold' }, 'Vælg sprog'),
                        ["English", "Spanish", "French", "German"].map(l => 
                            React.createElement('button', { key: l, onClick: () => { setSourceLang(l); setStep('input'); }, className: 'w-full p-4 border rounded-xl text-left hover:bg-slate-50' }, l)
                        )
                    ) :
                    step === 'input' ? React.createElement('div', { className: 'space-y-4' },
                        React.createElement('form', { onSubmit: handleTranslate, className: 'flex gap-2' },
                            React.createElement('input', { value: inputValue, onChange: e => setInputValue(e.target.value), className: 'flex-1 p-4 border rounded-xl', placeholder: 'Skriv ord...' }),
                            React.createElement('button', { className: 'bg-blue-600 text-white p-4 rounded-xl' }, 'OK')
                        ),
                        sentences.map(s => React.createElement('div', { key: s.id, className: 'p-3 bg-slate-50 rounded-lg flex justify-between' }, 
                            React.createElement('span', null, s.original),
                            React.createElement('span', { className: 'text-blue-600 italic' }, s.danish)
                        ))
                    ) : 
                    step === 'review' ? sentences.map(s => React.createElement('div', { key: s.id, className: 'mb-4 p-4 border rounded-xl flex justify-between items-center' },
                        React.createElement('div', null, React.createElement('p', null, s.original), React.createElement('p', { className: 'font-bold' }, s.danish)),
                        React.createElement('button', { onClick: () => playAudio(s.danish), className: 'p-3 bg-blue-50 rounded-full' }, '🔊')
                    )) :
                    React.createElement(Flashcards, { sentences, playAudio })
                ),
                React.createElement('button', { onClick: () => { localStorage.clear(); location.reload(); }, className: 'p-2 text-[10px] text-slate-300' }, 'Nulstil alt')
            );
        };

        const Flashcards = ({ sentences, playAudio }) => {
            const [idx, setIdx] = useState(0);
            const [flip, setFlip] = useState(false);
            if (sentences.length === 0) return 'Ingen gloser endnu.';
            const curr = sentences[idx];
            return React.createElement('div', { className: 'space-y-6' },
                React.createElement('div', { onClick: () => setFlip(!flip), className: 'h-64 bg-blue-600 rounded-[30px] flex items-center justify-center text-white text-2xl p-6 text-center cursor-pointer shadow-lg' },
                    flip ? curr.danish : curr.original
                ),
                React.createElement('div', { className: 'flex gap-4' },
                    React.createElement('button', { onClick: () => { setFlip(false); setIdx((idx + 1) % sentences.length); }, className: 'flex-1 p-4 bg-slate-100 rounded-xl' }, 'Næste'),
                    flip && React.createElement('button', { onClick: () => playAudio(curr.danish), className: 'p-4 bg-blue-50 rounded-xl' }, '🔊')
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
