<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoRecall - Active Recall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

        // ==========================================
        // INDSÆT DIN API-NØGLE HERUNDER:
        const API_KEY = "AIzaSyDgP2rMi6hsKRmm8WifIfgwTCv_ewr3iBg"; 
        // ==========================================

        const Icon = ({ name, size = 24 }) => {
            const icons = {
                plus: '<path d="M5 12h14m-7-7v14"/>',
                book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5a2.5 2.5 0 0 1 2.5-2.5H20v14"/>',
                card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
                volume: '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>',
                trash: '<path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
                send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'
            };
            return React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
                strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round",
                dangerouslySetInnerHTML: { __html: icons[name] }
            });
        };

        const App = () => {
            const [step, setStep] = useState('welcome');
            const [sourceLang, setSourceLang] = useState(() => localStorage.getItem('lingo_lang') || '');
            const [sentences, setSentences] = useState(() => JSON.parse(localStorage.getItem('lingo_sentences')) || []);
            const [inputValue, setInputValue] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);

            useEffect(() => {
                if (sourceLang) {
                    localStorage.setItem('lingo_lang', sourceLang);
                    if (step === 'welcome') setStep('input');
                }
            }, [sourceLang]);

            useEffect(() => {
                localStorage.setItem('lingo_sentences', JSON.stringify(sentences));
            }, [sentences]);

            const handleTranslate = async (e) => {
                e.preventDefault();
                const cleanKey = API_KEY.trim();
                
                if (!inputValue.trim() || isProcessing) return;
                if (!cleanKey) {
                    alert("API-nøgle mangler i koden!");
                    return;
                }

                setIsProcessing(true);
                const text = inputValue;
                setInputValue('');

                try {
                    // Opdateret URL baseret på din fejlbesked (v1beta + flash-latest)
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${cleanKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Translate "${text}" from ${sourceLang} to Danish. Return ONLY the translation.` }] }]
                        })
                    });
                    
                    const res = await resp.json();
                    
                    if (res.error) {
                        throw new Error(res.error.message);
                    }

                    const danish = res.candidates[0].content.parts[0].text.trim();
                    setSentences(prev => [{ id: Date.now(), original: text, danish, createdAt: Date.now() }, ...prev]);
                } catch (err) { 
                    console.error("Fejl-detaljer:", err);
                    alert("Der skete en fejl: " + err.message);
                }
                setIsProcessing(false);
            };

            const playAudio = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'da-DK';
                    msg.rate = 0.9;
                    window.speechSynthesis.speak(msg);
                } else {
                    alert("Lyd er ikke understøttet i denne browser.");
                }
            };

            return React.createElement('div', { className: 'max-w-md mx-auto min-h-screen flex flex-col shadow-2xl bg-white' },
                sourceLang && step !== 'welcome' && React.createElement('nav', { className: 'bg-white border-b p-4 sticky top-0 z-50 flex justify-around shadow-sm' },
                    ['input', 'review', 'flashcards'].map(s => React.createElement('button', {
                        key: s, onClick: () => setStep(s),
                        className: `flex flex-col items-center gap-1 transition-colors ${step === s ? 'text-blue-600' : 'text-slate-400'}`
                    }, React.createElement(Icon, { name: s === 'input' ? 'plus' : s === 'review' ? 'book' : 'card' })))
                ),
                React.createElement('main', { className: 'p-5 flex-1' },
                    (!sourceLang || step === 'welcome') && React.createElement('div', { className: 'pt-10 space-y-6 text-center animate-fade-in' },
                        React.createElement('div', { className: 'w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto shadow-xl mb-6' },
                            React.createElement('span', { className: 'text-white text-4xl font-bold' }, 'L')
                        ),
                        React.createElement('h1', { className: 'text-3xl font-black' }, 'LingoRecall'),
                        React.createElement('p', { className: 'text-slate-500' }, 'Vælg dit modersmål:'),
                        React.createElement('div', { className: 'grid gap-2 text-left h-[50vh] overflow-y-auto pr-2 bg-slate-50 rounded-xl p-2' },
                            ["English", "Spanish", "French", "German", "Arabic", "Hindi", "Russian", "Japanese", "Turkish", "Vietnamese", "Portuguese", "Italian", "Polish", "Ukrainian", "Persian", "Urdu", "Dutch", "Greek", "Swedish", "Thai"].map(l => 
                                React.createElement('button', {
                                    key: l, onClick: () => setSourceLang(l),
                                    className: 'p-4 bg-white border border-slate-100 rounded-xl hover:border-blue-500 font-medium transition-all shadow-sm flex justify-between items-center'
                                }, l, React.createElement('span', { className: 'text-blue-500 text-xl' }, '→'))
                            )
                        )
                    ),
                    sourceLang && step === 'input' && React.createElement('div', { className: 'space-y-6 animate-fade-in' },
                        React.createElement('header', null, React.createElement('h2', { className: 'text-2xl font-bold' }, 'Tilføj gloser'), React.createElement('p', { className: 'text-slate-400' }, sourceLang + ' → Dansk')),
                        React.createElement('form', { onSubmit: handleTranslate, className: 'relative' },
                            React.createElement('input', {
                                value: inputValue, onChange: e => setInputValue(e.target.value),
                                placeholder: 'Skriv på ' + sourceLang + '...',
                                className: 'w-full p-5 pr-14 bg-white rounded-2xl border-2 border-slate-100 shadow-sm focus:border-blue-500 outline-none text-lg transition-all',
                                disabled: isProcessing
                            }),
                            React.createElement('button', { type: 'submit', className: 'absolute right-3 top-3 bottom-3 w-10 bg-blue-600 text-white rounded-xl flex items-center justify-center active:scale-90 transition-transform' },
                                isProcessing ? React.createElement('div', { className: 'w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin' }) : React.createElement(Icon, { name: 'send', size: 18 })
                            )
                        ),
                        React.createElement('div', { className: 'space-y-3' },
                            sentences.length === 0 ? React.createElement('div', { className: 'p-10 text-center text-slate-300 italic' }, 'Ingen gemte sætninger endnu') :
                            sentences.map(s => React.createElement('div', { key: s.id, className: 'p-4 bg-white rounded-xl border border-slate-100 flex justify-between items-center shadow-sm animate-fade-in' },
                                React.createElement('div', { className: 'truncate pr-4' }, 
                                    React.createElement('p', { className: 'font-medium truncate text-slate-800' }, s.original),
                                    React.createElement('p', { className: 'text-blue-600 text-xs italic' }, s.danish)
                                ),
                                React.createElement('button', { onClick: () => setSentences(sentences.filter(x => x.id !== s.id)), className: 'text-slate-200 hover:text-red-500 transition-colors' }, React.createElement(Icon, { name: 'trash', size: 16 }))
                            ))
                        )
                    ),
                    sourceLang && step === 'review' && React.createElement('div', { className: 'space-y-4 animate-fade-in' },
                        React.createElement('h2', { className: 'text-2xl font-bold mb-4' }, 'Gennemse'),
                        sentences.map(s => React.createElement('div', { key: s.id, className: 'bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between shadow-sm' },
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-xs text-slate-300 font-bold uppercase mb-1' }, sourceLang),
                                React.createElement('p', { className: 'mb-3 text-slate-700' }, s.original),
                                React.createElement('p', { className: 'text-xs text-blue-500 font-bold uppercase mb-1' }, 'Dansk'),
                                React.createElement('p', { className: 'text-lg font-bold text-slate-900' }, s.danish)
                            ),
                            React.createElement('button', { onClick: () => playAudio(s.danish), className: 'w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100 active:scale-95 transition-all shadow-sm' }, React.createElement(Icon, { name: 'volume' }))
                        ))
                    ),
                    sourceLang && step === 'flashcards' && React.createElement(Flashcards, { sentences, playAudio, sourceLang })
                )
            );
        };

        const Flashcards = ({ sentences, playAudio, sourceLang }) => {
            const [stack, setStack] = useState([...sentences]);
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [done, setDone] = useState(false);

            if (sentences.length === 0) return React.createElement('div', { className: 'text-center py-20 text-slate-400' }, 'Tilføj gloser i menuen for at starte.');
            if (done) return React.createElement('div', { className: 'text-center py-10 space-y-6 animate-fade-in' }, 
                React.createElement('div', { className: 'text-6xl mb-4' }, '🥳'),
                React.createElement('h2', { className: 'text-2xl font-bold' }, 'Godt gået!'),
                React.createElement('button', { onClick: () => { setStack([...sentences]); setIdx(0); setDone(false); setFlipped(false); }, className: 'p-5 bg-blue-600 text-white rounded-2xl w-full font-bold shadow-lg active:scale-95 transition-transform' }, 'Øv igen')
            );

            const curr = stack[idx];
            const next = (correct) => {
                if (correct) {
                    if (idx + 1 >= stack.length) setDone(true);
                    else { setIdx(idx + 1); setFlipped(false); }
                } else {
                    const s = [...stack];
                    const item = s.splice(idx, 1)[0];
                    s.push(item);
                    setStack(s);
                    setFlipped(false);
                }
            };

            return React.createElement('div', { className: 'space-y-8 animate-fade-in' },
                React.createElement('div', { className: 'flex justify-between text-[10px] font-black text-slate-300 uppercase tracking-widest' }, 
                    React.createElement('span', null, 'Træning'), React.createElement('span', null, `${idx + 1} / ${stack.length}`)
                ),
                React.createElement('div', { 
                    className: 'relative h-80 w-full perspective-1000 cursor-pointer',
                    onClick: () => setFlipped(!flipped)
                },
                    React.createElement('div', { className: `relative w-full h-full card-transition preserve-3d ${flipped ? 'rotate-y-180' : ''}` },
                        React.createElement('div', { className: 'absolute inset-0 backface-hidden bg-white rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center border-2 border-slate-50' },
                            React.createElement('p', { className: 'text-xs text-blue-300 font-bold mb-4 uppercase' }, sourceLang),
                            React.createElement('p', { className: 'text-2xl font-medium text-slate-800' }, curr.original),
                            React.createElement('p', { className: 'mt-10 text-xs text-slate-300 animate-pulse' }, 'Tryk for at se svar')
                        ),
                        React.createElement('div', { className: 'absolute inset-0 backface-hidden rotate-y-180 bg-blue-600 rounded-[40px] shadow-xl flex flex-col items-center justify-center p-8 text-center text-white' },
                            React.createElement('p', { className: 'text-xs text-blue-200 font-bold mb-4 uppercase' }, 'Dansk'),
                            React.createElement('p', { className: 'text-2xl font-bold mb-8' }, curr.danish),
                            React.createElement('button', { onClick: (e) => { e.stopPropagation(); playAudio(curr.danish); }, className: 'w-16 h-16 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-all' }, React.createElement(Icon, { name: 'volume', size: 32 }))
                        )
                    )
                ),
                React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                    React.createElement('button', { onClick: () => next(false), className: 'p-5 bg-white border-2 border-red-50 text-red-500 rounded-2xl font-bold shadow-sm active:scale-95 transition-all' }, 'Svært'),
                    React.createElement('button', { onClick: () => next(true), className: 'p-5 bg-white border-2 border-green-50 text-green-600 rounded-2xl font-bold shadow-sm active:scale-95 transition-all' }, 'Let')
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
